      <h2 class="post-title">反向标签劫持及其防御</h2>
      <p class="post-excerpt">我第一次听说“反向标签劫持”这个词的时候，脑子里蹦出来的画面是某个黑客在远程操控我的浏览器标签页，像遥控器换台一样把我的页面切来切去。后来真正了解之后才发现，这个理解虽然粗糙，但方向居然没有偏太多——反向标签劫持确实能让一个你根本没想...</p>
